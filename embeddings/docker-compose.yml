services:
  embeddings:
    build: .
    image: ai-study-embeddings:1.0.0
    container_name: ai-study-embeddings
    ports:
      - "8000:8000"
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    volumes:
      # Persist the FastEmbed model cache so restarts don't re-download.
      - fastembed-cache:/root/.cache/fastembed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; print(json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=10)))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

volumes:
  fastembed-cache:
